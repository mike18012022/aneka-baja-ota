<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aneka Baja — Dashboard Sales Kanvasing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#10141B;        /* app bar / dark shell */
  --ink-2:#1B222D;
  --surface:#FFFFFF;
  --bg:#EEF1F5;         /* content area */
  --line:#E2E6EC;
  --text:#0E141C;
  --muted:#465059;
  --signal:#FF6A2B;     /* hi-vis field accent */
  --signal-d:#E8531A;
  --ok:#12A150;         /* location locked / verified */
  --ok-soft:#E4F6EC;
  --warn:#B9540A;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,20,27,.06),0 8px 24px rgba(16,20,27,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{font-family:'Space Grotesk','Inter',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:inherit}
.hidden{display:none !important}

/* ---------- App shell ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:74px}
.manager .app{max-width:1080px}

.topbar{
  background:#fff;color:var(--text);padding:7px 14px 8px;
  position:sticky;top:0;z-index:20;
  border-bottom:2px solid var(--signal);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.tb-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.tb-hello{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.tb-hello b{color:var(--signal-d);font-weight:600}
.tb-r{display:flex;align-items:center;gap:10px;flex:none}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;letter-spacing:.5px;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--signal);display:grid;place-items:center;color:#0b0d11;font-weight:700;font-size:14px;transform:rotate(-6deg)}
.topbar .userline{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:12px}
.topbar .hello{font-family:'Space Grotesk';font-weight:600;font-size:19px;line-height:1.15}
.topbar .role-chip{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--signal);background:rgba(255,106,43,.14);padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:4px}
.topbar .clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.05}
.topbar .clock .date{font-size:11px;font-weight:600;color:var(--muted)}
.topbar .clock .time{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:16px;letter-spacing:-.5px}
.logout{color:var(--muted);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;background:#EEF1F5;padding:6px 10px;border-radius:8px;flex:none}
.logout:hover{color:var(--text);background:#e2e6ec}

.content{padding:18px}

/* ---------- Cards / generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
body:not(.manager) .content{padding:12px 12px 4px}
body:not(.manager) .card{padding:14px;margin-bottom:0}
body:not(.manager) .card .sub{margin-bottom:12px}
body:not(.manager) label.fld{margin-bottom:11px}
body:not(.manager) #cNote{min-height:50px}
body:not(.manager) .loc-map{height:100px}
body:not(.manager) .btn{padding:11px 14px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.section-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--signal);margin:0 0 3px}

label.fld{display:block;margin-bottom:14px}
label.fld .lbl{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px}
input[type=text],input[type=password],textarea,select{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  background:#FbFcFd;color:var(--text);transition:border-color .15s, box-shadow .15s;
}
textarea{resize:vertical;min-height:74px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(255,106,43,.14)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 16px;border-radius:11px;font-weight:600;font-size:15px;
  background:var(--signal);color:#fff;width:100%;transition:transform .05s, background .15s;
}
.btn:hover{background:var(--signal-d)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#C9CFD7;cursor:not-allowed}
.btn.ghost{background:var(--ink);color:#fff}
.btn.ghost:hover{background:var(--ink-2)}
.btn.outline{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn.outline:hover{border-color:var(--signal);color:var(--signal-d)}
.btn.sm{padding:9px 13px;font-size:13px;width:auto}
.btn.ok{background:var(--ok)}
.btn.ok:hover{filter:brightness(.94)}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;max-width:440px;margin:0 auto}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login-brand .mark{width:44px;height:44px;border-radius:12px;background:var(--signal);display:grid;place-items:center;color:#0b0d11;font-family:'Space Grotesk';font-weight:700;font-size:22px;transform:rotate(-6deg)}
.login-brand .t1{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.5px}
.login-brand .t2{font-size:12.5px;color:var(--muted);margin-top:1px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px}
.login-card h1{font-size:20px;margin:0 0 3px}
.login-card p.desc{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.err{background:#FDEDE8;color:#B23310;border:1px solid #F6C9B8;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px}
.demo-box{margin-top:18px;background:#F5F7F9;border:1px dashed var(--line);border-radius:11px;padding:13px 14px;font-size:12.5px;color:var(--muted)}
.demo-box b{color:var(--text)}
.demo-box .row{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.demo-box code{background:#E8ECF0;padding:1px 6px;border-radius:5px;color:var(--text);font-family:'Space Grotesk'}

/* ---------- Location + photo capture ---------- */
.loc-block{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.loc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;gap:10px}
.loc-head .st{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#C9CFD7;flex:none}
.dot.locked{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.dot.load{background:var(--signal);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.loc-meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.loc-map{width:100%;height:150px;border:none;display:block;background:#dde3ea}
.chip-ok{color:var(--ok);font-weight:600}

.photo-drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s;background:#FbFcFd}
.photo-drop:hover{border-color:var(--signal)}
.photo-drop .ic{font-size:26px;margin-bottom:4px}
.photo-drop small{display:block;font-size:11.5px;margin-top:3px}
.photo-prev{position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.photo-prev img{width:100%;display:block}
.photo-prev .rm{position:absolute;top:8px;right:8px;background:rgba(16,20,27,.72);color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;display:grid;place-items:center}

/* ---------- Visit list (sales) ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.list-head .t{font-family:'Space Grotesk';font-weight:600;font-size:15px}
.count-pill{background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.visit{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;box-shadow:var(--shadow)}
.visit .thumb{width:58px;height:58px;border-radius:9px;object-fit:cover;flex:none;background:#E8ECF0;display:grid;place-items:center;color:#9aa4b0;font-size:11px}
.visit .body{flex:1;min-width:0}
.visit .toko{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.visit .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.visit .note{font-size:12.5px;color:var(--text);margin-top:5px;background:#F5F7F9;border-radius:7px;padding:5px 8px}
.visit .maplink{font-size:12px;color:var(--signal-d);font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.empty .ic{font-size:30px;display:block;margin-bottom:6px;opacity:.5}

/* ---------- Manager ---------- */
.mgr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.stat .n{font-family:'Space Grotesk';font-weight:700;font-size:26px;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
.stat.accent{border-color:var(--signal);background:linear-gradient(180deg,#fff,#FFF4EE)}
.stat.accent .n{color:var(--signal-d)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.toolbar .fld{margin:0}
.toolbar select,.toolbar input[type=text]{width:auto;min-width:150px;padding:9px 11px}
.spacer{flex:1}

.tabs{display:flex;gap:4px;background:#E4E8ED;padding:4px;border-radius:12px;margin-bottom:16px}
.tab{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);text-align:center}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{background:#F5F7F9;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;position:sticky;top:0}
td.periode-info{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;padding:8px 12px;background:#F4F6F8;border-radius:9px}
.waktu-cell{white-space:nowrap;line-height:1.35}
.wk-tgl{font-weight:600;font-size:12.5px}
.wk-hari{font-size:11px;color:var(--muted)}
.wk-jam{font-size:12px;font-weight:600;color:var(--signal)}
.note-cell{white-space:normal;min-width:240px;max-width:360px;color:var(--text);font-size:12.5px;line-height:1.45}
tr:last-child td{border-bottom:none}
.tbl-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;cursor:pointer;background:#E8ECF0}
.mini-map{color:var(--signal-d);font-weight:600;font-size:12px}
.sales-tag{font-weight:600}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.chart-box h3{margin:0 0 12px;font-size:14px;font-weight:600}
.chart-box canvas{max-height:260px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,13,18,.88);display:grid;place-items:center;z-index:100;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:12px}
.lightbox .x{position:absolute;top:18px;right:20px;color:#fff;font-size:30px}

/* Toast */
.toast{pointer-events:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.ok{background:var(--ok)}

/* mobile */
@media (max-width:640px){
  .mgr-grid{grid-template-columns:1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .manager .app{max-width:520px}
}

/* Print — one page report only */
@media print{
  body{background:#fff}
  .app{padding:0;max-width:100%}
  .topbar,.tabs,.toolbar,.no-print,.tabnav{display:none !important}
  .content{padding:0}
  #report{display:block !important}
  .chart-grid{grid-template-columns:1fr 1fr}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .chart-box{break-inside:avoid}
}

/* Scrollable manager tabs (5 tabs) */
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap;padding:9px 14px}

/* Route map */
#routeMap{height:440px;width:100%;border-radius:12px;z-index:1}
@media(max-width:640px){#routeMap{height:340px}}
.leaflet-container{font-family:'Inter',sans-serif;border-radius:12px}
.route-pin{background:var(--signal);color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:12px;width:26px;height:26px;border-radius:50% 50% 50% 2px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;transform:rotate(45deg)}
.route-pin span{transform:rotate(-45deg)}
.route-pin.first{background:var(--ok)}
.route-pin.last{background:var(--ink)}
.route-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.route-legend b{color:var(--text)}
.lg-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Sample-data box */
.seed-box{background:#fff;border:1px dashed var(--signal);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seed-box .txt{flex:1;min-width:200px}
.seed-box .txt b{font-size:14px}
.seed-box .txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* Daily report per-sales rows */
.day-sales{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.day-sales:last-child{border-bottom:none}
.day-sales .bar{height:8px;border-radius:6px;background:var(--signal);flex:1;margin:0 12px;max-width:none}
.day-sales .nm{font-weight:600;font-size:13.5px;min-width:120px}
.day-sales .ct{font-family:'Space Grotesk';font-weight:700;min-width:26px;text-align:right}

/* Bottom nav (sales) */
.tabnav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:15;box-shadow:0 -4px 16px rgba(16,20,27,.05)}
.tabnav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
.tabnav button .ic{font-size:19px}
.tabnav button.active{color:var(--signal-d)}
.brand-logo{height:20px;width:auto;display:block}
.login-brand{flex-direction:column;align-items:flex-start;gap:8px}
.login-logo{max-height:32px;max-width:100%;width:auto;height:auto;display:block}
.login-tag{font-size:12.5px;color:var(--muted)}
.rp-wrap{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#FbFcFd;overflow:hidden}
.rp-wrap .rp{padding:0 10px;color:var(--muted);font-weight:600;font-size:14px}
.rp-wrap input{border:none;background:transparent;padding:12px 12px 12px 0;box-shadow:none}
.rp-wrap:focus-within{border-color:var(--signal);box-shadow:0 0 0 3px rgba(255,106,43,.14)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lbl2{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.photo-4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:2px}
.photo-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.photo-drop.sm{padding:22px 6px;font-size:12px}
.photo-drop.sm .ic{font-size:28px;margin-bottom:4px}
.photo-prev.sm{margin-bottom:0}
.photo-prev.sm img{height:104px;object-fit:cover;width:100%}
.armada-row{display:flex;gap:18px;margin-bottom:12px}
.armada-row .arm{display:flex;flex-direction:column;gap:4px}
.armada-row select{width:92px}
.fld-block{display:block;margin-bottom:11px}
.chk-inline{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);font-size:13px;margin:2px 0 8px;cursor:pointer}
.chk-inline input{width:18px;height:18px;accent-color:var(--signal);margin:0;flex:none}
.chk-baru{color:#1F8F4E;font-weight:600}
.chk-faktur{color:#1D5FA8;font-weight:600;margin-bottom:4px}
.chk-faktur input{accent-color:#1D5FA8}
.chk-baru input{accent-color:#1F8F4E}
.badge-baru{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#1F8F4E;padding:1px 7px;border-radius:6px;letter-spacing:.3px;vertical-align:middle;margin-left:4px}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:4px}
.chk-grid .chk-inline{margin:0}
.barang-list{font-size:10.5px;color:#1F8F4E;font-weight:600;margin-top:2px;line-height:1.3}
.pic-line{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.badge-kat{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
.kat-toko{background:#EEF1F5;color:#465059}
.kat-proyek{background:#FFEEE3;color:#C24A0F}
.role-edit{font-size:13px;padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;min-width:130px}
.act-cell{white-space:nowrap}
.map-tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.req{color:#C0392B;font-size:10.5px;font-weight:700;letter-spacing:.2px}
.prospek-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:4px 0 2px}
.pchip{position:relative;display:flex;align-items:center;justify-content:center;padding:11px 4px;border:2px solid var(--line);border-radius:11px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;color:var(--muted)}
.pchip input{position:absolute;opacity:0;width:0;height:0}
.pchip:active{transform:scale(.97)}
.p-high:has(input:checked){background:#E8F6EE;border-color:#1F8F4E;color:#146B39}
.p-med:has(input:checked){background:#FFF3E0;border-color:#E8891A;color:#A15A00}
.p-low:has(input:checked){background:#EEF1F5;border-color:#7A8794;color:#4A5561}
.toko-id{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:700;color:#1D5FA8;background:#EAF1FB;border:1px solid #CBDDF5;padding:1px 7px;border-radius:6px;margin-top:4px;letter-spacing:.3px}

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   BACKEND LAYER — PocketBase (self-hosted on Synology).
   This file is served by PocketBase from ./pb_public, so the
   API is same-origin. Auth token is kept in localStorage so
   a sales logs in once per device and stays logged in.
========================================================= */
const PB = 'https://sales.anekabajabekasi.com';                       // same origin (served by PocketBase)
let AUTH = null;                     // {token, record}

function saveAuth(a){ AUTH=a; try{ a?localStorage.setItem('kanvas_auth',JSON.stringify(a)):localStorage.removeItem('kanvas_auth'); }catch(_){} }
function loadAuth(){ try{ return JSON.parse(localStorage.getItem('kanvas_auth')); }catch(_){ return null; } }

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(AUTH && AUTH.token) headers['Authorization'] = AUTH.token;
  const res = await fetch(PB + path, Object.assign({}, opts, {headers}));
  let data={}; try{ data = await res.json(); }catch(_){}
  if(!res.ok) throw {status:res.status, data};
  return data;
}
const fileUrl = (rec,field)=> rec[field] ? `${PB}/api/files/visits/${rec.id}/${rec[field]}` : '';

/* =========================================================
   ANTREAN OFFLINE — kalau server tak terjangkau saat submit,
   simpan di IndexedDB HP lalu kirim ulang otomatis.
========================================================= */
const QDB_NAME='kanvas_queue', QDB_STORE='pending';
function qOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(QDB_NAME,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(QDB_STORE,{keyPath:'id',autoIncrement:true}); };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function qAdd(label,path,fd){
  const entries=[]; for(const [k,v] of fd.entries()) entries.push([k,v]); // Blob/File clone fine in IDB
  const db=await qOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(QDB_STORE,'readwrite');
    tx.objectStore(QDB_STORE).add({label,path,entries,createdAt:Date.now()});
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function qAll(){
  const db=await qOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(QDB_STORE,'readonly');
    const r=tx.objectStore(QDB_STORE).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  });
}
async function qRemove(id){
  const db=await qOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(QDB_STORE,'readwrite');
    tx.objectStore(QDB_STORE).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
let qSyncing=false;
async function qSync(){
  if(qSyncing) return; qSyncing=true;
  try{
    const items=await qAll();
    for(const it of items){
      const fd=new FormData(); it.entries.forEach(([k,v])=>fd.append(k,v));
      try{
        await api(it.path,{method:'POST',body:fd});
        await qRemove(it.id);
      }catch(err){
        if(err && typeof err.status==='number'){ await qRemove(it.id); } // error data tetap, jangan diulang selamanya
        else break; // masih offline, hentikan & coba lagi nanti
      }
    }
  }catch(_){}
  qSyncing=false;
  updateQueueBadge();
}
async function updateQueueBadge(){
  let n=0; try{ n=(await qAll()).length; }catch(_){}
  document.querySelectorAll('.queue-badge').forEach(el=>{
    if(n>0){ el.hidden=false; el.textContent=`⏳ ${n} ${n===1?'data':'data'} menunggu terkirim — akan otomatis dikirim saat server tersambung`; }
    else el.hidden=true;
  });
  return n;
}
window.addEventListener('online', qSync);
setInterval(qSync, 25000);

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function fmtTanggal(d){ return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtJam(d){ return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtJamShort(d){ return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function gmaps(lat,lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }
function osmEmbed(lat,lng){
  const dx=0.004, dy=0.0025;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${lng-dx}%2C${lat-dy}%2C${lng+dx}%2C${lat+dy}&layer=mapnik&marker=${lat}%2C${lng}`;
}
function toast(msg, ok=true){
  const t=$('#toast'); t.textContent=(ok?'✓  ':'⚠  ')+msg;
  t.className='toast show'+(ok?' ok':''); setTimeout(()=>t.className='toast',2400);
}

/* Compress an image file -> small jpeg Blob for upload */
function compressImage(file, maxSize=1200, quality=0.6){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>h && w>maxSize){ h=h*maxSize/w; w=maxSize; }
      else if(h>maxSize){ w=w*maxSize/h; h=maxSize; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}

/* Map a PocketBase visit record -> the shape the UI expects */
function mapVisit(r){
  const t = new Date(r.visitTime || r.created);
  return {
    id:r.id, ts:t.getTime(),
    username:r.sales,
    salesName:(r.expand && r.expand.sales && r.expand.sales.name) || '—',
    toko:r.toko||'', tokoId:r.tokoId||'', telp:r.telp||'', tokoBaru:!!r.tokoBaru, barangDijual:r.barangDijual||'', picNama:r.picNama||'', picTelp:r.picTelp||'', picJabatan:r.picJabatan||'', prospek:r.prospek||'', kategori:r.kategori||'Toko', note:r.note||'',
    lat:r.lat, lng:r.lng, acc:r.acc,
    photo: fileUrl(r,'photo'),
    photo2: fileUrl(r,'photo2'),
    date: r.date || ymd(t),
    sample: !!r.sample
  };
}

/* Load all visits (manager) or one sales' visits — paginated */
async function loadVisits(filterUser){
  const base=`/api/collections/visits/records?perPage=500&sort=-visitTime&expand=sales`
    + (filterUser?`&filter=${encodeURIComponent(`sales='${filterUser}'`)}`:'');
  let page=1, out=[];
  while(true){
    const d=await api(`${base}&page=${page}`);
    (d.items||[]).forEach(r=>out.push(mapVisit(r)));
    if(!d.items || !d.items.length || page>=(d.totalPages||1)) break;
    page++;
  }
  return out;
}

========================================================= */
let SESSION=null, CLOCK=null;
function isProyek(){ return (typeof salesTab!=='undefined' && salesTab==='proyek') || !!(SESSION && SESSION.role==='sales_proyek'); }
function isAdmin(){ return !!(SESSION && SESSION.role==='admin'); }
function prospekBadge(p){
  if(!p) return '';
  const k=String(p).toUpperCase();
  const cls=k==='HIGH'?'pr-high':(k==='MEDIUM'?'pr-med':'pr-low');
  return `<span class="badge-prospek ${cls}">${k} PROSPEK</span>`;
}
function isManagerLevel(){ return !!(SESSION && (SESSION.role==='manager' || SESSION.role==='admin')); }
function ITEM_LABEL(){ return isProyek() ? 'Project' : 'Toko'; }

async function boot(){
  const a = loadAuth();
  if(a && a.token){
    AUTH=a;
    try{
      const d = await api('/api/collections/users/auth-refresh',{method:'POST',headers:{'Content-Type':'application/json'}});
      saveAuth({token:d.token, record:d.record});
      SESSION=d.record; route(); qSync(); return;
    }catch(_){ saveAuth(null); }
  }
  renderLogin();
}

async function doLogin(identity, password){
  try{
    const d = await api('/api/collections/users/auth-with-password',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({identity:identity.trim(), password})
    });
    saveAuth({token:d.token, record:d.record});
    SESSION=d.record; return true;
  }catch(_){ return false; }
}
function doLogout(){
  saveAuth(null); SESSION=null; if(CLOCK) clearInterval(CLOCK);
  document.body.classList.remove('manager');
  renderLogin();
}
function route(){
  document.body.classList.toggle('manager', isManagerLevel());
  if(isManagerLevel()) renderManager(); else renderSales();
}

/* --- Laporan riwayat kunjungan sebagai gambar JPEG --- */
function wrapCanvasText(ctx,text,x,y,maxW,lh){
  const words=String(text).split(' '); let line='',ny=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,ny); line=w; ny+=lh; }
    else line=test;
  }
  if(line) ctx.fillText(line,x,ny);
  return ny+lh;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
async function buildRiwayatJpeg(salesName, visits){
  const single = visits.length===1;
  const W=900, PAD=44;
  const rowH = single?0:64;
  let extraH=0;
  if(single){
    const v=visits[0];
    extraH = 60; // toko+badge line
    extraH += 30; // date/time
    if(v.telp) extraH+=28;
    if(v.tokoBaru && v.barangDijual) extraH+=28;
    if(v.note) extraH += 26*Math.max(1,Math.ceil(String(v.note).length/70));
    extraH += 34; // maps link line
  }
  const H = single ? (170+extraH+60) : (190 + visits.length*rowH + 70);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=Math.max(H,320);
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,cv.height);
  ctx.fillStyle='#0E141C'; ctx.font='bold 30px Arial'; ctx.fillText('ANEKA BAJA', PAD, 56);
  ctx.fillStyle='#666666'; ctx.font='16px Arial'; ctx.fillText(single?'Laporan Kunjungan':'Laporan Riwayat Kunjungan', PAD, 82);
  ctx.fillStyle='#465059'; ctx.font='15px Arial';
  ctx.fillText('Sales: '+salesName, PAD, 112);
  ctx.textAlign='right'; ctx.fillText(fmtTanggal(new Date()), W-PAD, 82); ctx.textAlign='left';
  ctx.strokeStyle='#FF6A2B'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(PAD,128); ctx.lineTo(W-PAD,128); ctx.stroke();
  let y=128;
  if(!visits.length){
    ctx.fillStyle='#888'; ctx.font='16px Arial'; ctx.fillText('Belum ada kunjungan tercatat.', PAD, y+40);
  } else if(single){
    const v=visits[0]; const d=new Date(v.ts);
    let ry=y+46;
    ctx.fillStyle='#0E141C'; ctx.font='bold 24px Arial';
    ctx.fillText(v.toko||'-', PAD, ry);
    const tokoW=ctx.measureText(v.toko||'-').width;
    if(v.tokoBaru){
      ctx.fillStyle='#1F8F4E'; roundRect(ctx,PAD+tokoW+14, ry-22, 96, 24, 6); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.fillText('TOKO BARU', PAD+tokoW+24, ry-6);
    }
    ry+=32;
    ctx.fillStyle='#465059'; ctx.font='15px Arial';
    ctx.fillText(`${HARI[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} · ${fmtJamShort(d)}`, PAD, ry);
    ry+=8;
    if(v.telp){ ry+=28; ctx.fillStyle='#0E141C'; ctx.font='14px Arial'; ctx.fillText('Telp: '+v.telp, PAD, ry); }
    if(v.tokoBaru && v.barangDijual){ ry+=28; ctx.fillStyle='#1F8F4E'; ctx.font='bold 14px Arial'; ry=wrapCanvasText(ctx,'Barang: '+v.barangDijual, PAD, ry, W-2*PAD, 20); }
    if(v.note){ ry+=22; ctx.fillStyle='#465059'; ctx.font='14px Arial'; ry=wrapCanvasText(ctx,'Catatan: '+v.note, PAD, ry, W-2*PAD, 22); }
    ry+=30;
    ctx.fillStyle='#E86A2B'; ctx.font='bold 14px Arial'; ctx.fillText('📍 Lokasi: '+gmaps(v.lat,v.lng), PAD, ry);
  } else {
    visits.forEach((v,i)=>{
      const ry=y+22+i*rowH;
      if(i%2===1){ ctx.fillStyle='#FAFAFA'; ctx.fillRect(PAD-10, ry-30, W-2*PAD+20, rowH); }
      ctx.fillStyle='#1F8F4E'; ctx.font='bold 13px Arial'; ctx.fillText(String(i+1).padStart(2,'0'), PAD, ry-4);
      ctx.fillStyle='#0E141C'; ctx.font='bold 17px Arial';
      let tokoText=v.toko||'-';
      ctx.fillText(tokoText, PAD+38, ry-4);
      const tokoW=ctx.measureText(tokoText).width;
      if(v.tokoBaru){
        ctx.fillStyle='#1F8F4E'; roundRect(ctx,PAD+38+tokoW+10, ry-22, 84, 20, 5); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.fillText('TOKO BARU', PAD+38+tokoW+18, ry-8);
      }
      const d=new Date(v.ts);
      ctx.fillStyle='#465059'; ctx.font='13px Arial';
      ctx.fillText(`${HARI[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} · ${fmtJamShort(d)}`, PAD+38, ry+18);
    });
  }
  ctx.fillStyle='#999'; ctx.font='12px Arial';
  ctx.fillText(`Total ${visits.length} kunjungan · dibuat otomatis oleh dashboard KANVAS`, PAD, cv.height-24);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.92));
}

    $('#vdDlBtn').onclick=async()=>{

        const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; a.click();
      }catch(e){ toast('Gagal membuat gambar',false); }

    };
  }
  document.querySelectorAll('.visit').forEach(el=>{

  });

async function buildTempoPdf(d){
  if(!window.jspdf) return null;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const M=16, W=210, BOT=281;
  const judulToko=String(d.namaToko||'-').toUpperCase();
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20);
  const judulLines=doc.splitTextToSize(judulToko, W-2*M-42);
  doc.text(judulLines, M, 20);
  const jH=(judulLines.length-1)*6.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(102);
  doc.text('Laporan Pengajuan Tempo · Aneka Baja', M, 26+jH);
  doc.setFontSize(10);
  doc.text(String(d.tgl||''), W-M, 20, {align:'right'});
  doc.setDrawColor(255,106,43); doc.setLineWidth(0.8); doc.line(M, 30+jH, W-M, 30+jH);
  doc.setTextColor(20);
  const term=d.termPembayaran||'-'; const dm=/(\d+)/.exec(term); const tempo=dm?dm[1]+' hari':(term||'-');
  const omsetNum=Number((d.omset||'').toString().replace(/\D/g,''))||0;
  const rows=[
    ['Nama Toko', d.namaToko||'-'],
    ['Sales', d.salesName||'-'],
    ['Tempo', tempo],
    ['Omzet / bulan', 'Rp '+omsetNum.toLocaleString('id-ID')],
    ['Alamat Toko', d.alamatToko||'-'],
    ['Penanggung Jawab', d.penanggungJawab||'-'],
    ['No. Telp PJ', d.telpPj||'-'],
    ['Alamat Penagihan', d.alamatPenagihan||'(sama dengan alamat toko)'],
    ['Jumlah Armada', 'Truk: '+(d.jumlahTruk||'0')+'    Pickup: '+(d.jumlahPickup||'0')],
    ['Term Pembayaran', term],
    ['Lokasi (Google Maps)', d.mapsUrl||'-'],
    ['Pakai Faktur Pajak', d.pakaiFaktur?'Ya':'Tidak'],
    ...(d.pakaiFaktur?[['Nama Perusahaan', d.namaPerusahaan||'-'],['Nama Direktur', d.namaDirektur||'-'],['No. Telp PIC (Faktur)', d.telpPicFaktur||'-']]:[]),
    ['Catatan Sales', d.note||'-'],
  ];
  doc.setFontSize(11);
  const labelW=44, valX=M+labelW, valW=W-M-valX;
  let y=40+jH;
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.text(k, M, y);
    doc.setFont('helvetica','normal');
    const sv=String(v);
    if(/^https?:\/\//.test(sv)){
      doc.setTextColor(30,100,200); doc.textWithLink('Buka di Google Maps', valX, y, {url:sv}); doc.setTextColor(20); y+=7;
    } else {
      const lines=doc.splitTextToSize(sv, valW); doc.text(lines, valX, y); y += Math.max(7, lines.length*5.5);
    }
    if(y>BOT-10){ doc.addPage(); y=20; }
  });
  const b2u=(b)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});
  const photos=[{b:d.fotoDepan,l:'Tampak Depan'},{b:d.fotoStok,l:'Stok'},{b:d.fotoStok2,l:'Stok 2'},{b:d.fotoKtp,l:'KTP PJ'},...(d.fotoNpwp?[{b:d.fotoNpwp,l:'NPWP'}]:[])].filter(p=>p.b);
  if(photos.length){
    y+=5;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Foto Laporan', M, y); y+=5;
    const gap=8, cellW=(W-2*M-gap)/2, cellH=54;
    for(let i=0;i<photos.length;i++){
      const col=i%2, row=Math.floor(i/2);
      const x=M+col*(cellW+gap), yy=y+row*(cellH+11);
      try{
        const url=await b2u(photos[i].b);
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90);
        doc.text(photos[i].l, x, yy);
        doc.addImage(url,'JPEG',x,yy+2,cellW,cellH);
      }catch(_){}
    }
  }
  return doc.output('blob');
}

        const dt=new Date(y,m,d,Math.floor(mins/60),mins%60);
        try{
          await api('/api/collections/visits/records',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              sales:s.id, toko:tokoPool[Math.floor(Math.random()*tokoPool.length)],
              note:notePool[Math.floor(Math.random()*notePool.length)],
              lat,lng,acc:5+Math.floor(Math.random()*25),
              visitTime:dt.toISOString(), date:ymd(dt), sample:true
            })});
          made++;
        }catch(_){}
        mins+=60+Math.floor(Math.random()*70);
      }
    }
  }
  mgrData=await loadVisits();
  toast(made?`${made} kunjungan contoh dibuat ✓`:'Gagal membuat data contoh — cek aturan akses',!!made);
  drawManager();
}
async function clearSampleData(){
  const btn=$('#btnUnseed'); if(btn){btn.disabled=true;btn.textContent='Menghapus…';}
  try{
    // fetch all sample visits (paged), then delete
    let page=1, ids=[];
    while(true){
      const d=await api(`/api/collections/visits/records?perPage=200&page=${page}&filter=${encodeURIComponent("sample=true")}`);
      (d.items||[]).forEach(r=>ids.push(r.id));
      if(!d.items || page>=d.totalPages) break; page++;
    }
    for(const id of ids){ try{ await api(`/api/collections/visits/records/${id}`,{method:'DELETE'}); }catch(_){} }
    toast('Data contoh dihapus ✓');
  }catch(_){ toast('Gagal menghapus data contoh',false); }
  mgrData=await loadVisits();
  drawManager();
}

/* PDF A4 rekap 1 kunjungan — foto besar & jelas */
async function buildVisitPdf(v){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const M=14, BOT=H-14;
  const d=new Date(v.ts);
  const L=(v.kategori==='Proyek')?'Project':'Toko';

  const judul=String(v.toko||'-').toUpperCase();
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20);
  const jl=doc.splitTextToSize(judul, W-2*M-40);
  doc.text(jl, M, 20);
  const jH=(jl.length-1)*6.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(102);
  doc.text(`Rekap Kunjungan ${L} · Aneka Baja`, M, 26+jH);
  doc.setFontSize(10);
  doc.text(fmtTanggal(d), W-M, 20, {align:'right'});
  doc.setDrawColor(255,106,43); doc.setLineWidth(0.8); doc.line(M,30+jH,W-M,30+jH);

  let y=40+jH;
  const rows=[
    ...(v.tokoId?[['ID Toko', v.tokoId]]:[]),
    ['Sales', v.salesName||'-'],
    ['Kategori', v.kategori||'Toko'],
    [`Nama ${L}`, v.toko||'-'],
    ['No. Telepon', v.telp||'-'],
    [`${L} Baru`, v.tokoBaru?'Ya':'Tidak'],
    ...(v.tokoBaru?[['Tingkat Prospek', v.prospek||'-']]:[]),
    ...(v.barangDijual?[['Barang Dijual', v.barangDijual]]:[]),
    ...(v.picNama?[['PIC', v.picNama + (v.picJabatan?' ('+v.picJabatan+')':'') + (v.picTelp?' · '+v.picTelp:'')]]:[]),
    ['Waktu Kunjungan', `${HARI[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${fmtJamShort(d)}`],
    ['Lokasi GPS', (v.lat&&v.lng)?gmaps(v.lat,v.lng):'-'],
    ['Akurasi GPS', v.acc?`± ${v.acc} m`:'-'],
    ['Catatan Sales', v.note||'-'],
  ];
  const valX=M+52, valW=W-valX-M;
  doc.setFontSize(10);
  rows.forEach(([k,val])=>{
    doc.setFont('helvetica','bold'); doc.setTextColor(60); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(20);
    const sv=String(val);
    if(/^https?:\/\//.test(sv)){
      doc.setTextColor(30,100,200); doc.textWithLink('Buka di Google Maps', valX, y, {url:sv}); doc.setTextColor(20); y+=7;
    } else {
      const lines=doc.splitTextToSize(sv, valW);
      doc.text(lines, valX, y); y += Math.max(7, lines.length*5.5);
    }
    if(y>BOT-20){ doc.addPage(); y=20; }
  });

  const urls=[{u:v.photo,l:'Foto 1'},{u:v.photo2,l:'Foto 2'}].filter(x=>x.u);
  if(urls.length){
    y+=6;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Foto Kunjungan', M, y); y+=5;
    const gap=8, cellW=(W-2*M-gap)/2, cellH=78;
    for(let i=0;i<urls.length;i++){
      const x=M+i*(cellW+gap);
      try{
        const resp=await fetch(urls[i].u); const blob=await resp.blob();
        const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90);
        doc.text(urls[i].l, x, y);
        doc.addImage(dataUrl,'JPEG',x,y+2,cellW,cellH);
      }catch(_){}
    }
  }
  return doc.output('blob');
}

    <div class="photo-2">

      <div class="pslot" id="edF2Area"></div>
    </div>
    <button class="btn" id="edSave" style="margin-top:8px">${isNew?'Simpan kunjungan baru':'Simpan perubahan'}</button>
  `;
  ov.hidden=false;
  const close=()=>{ ov.hidden=true; card.innerHTML=''; };
  $('#edClose').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  $('#edBaru').onchange=()=>{ $('#edBaruWrap').style.display=$('#edBaru').checked?'':'none'; };

  const edPhotos={};
  function slot(id,key,existing){
    const area=$('#'+id);
    if(existing && !edPhotos[key]){
      area.innerHTML=`<div class="photo-prev sm"><img src="${existing}"><button class="rm">✕</button></div>`;
      area.querySelector('.rm').onclick=()=>{ slot(id,key,null); };
      return;
    }
    area.innerHTML=`<div class="photo-drop sm"><div class="ic">📷</div>${key==='f1'?'Foto 1':'Foto 2'}</div><input type="file" accept="image/*" class="hidden">`;
    const drop=area.querySelector('.photo-drop'), inp=area.querySelector('input');
    drop.onclick=()=>inp.click();
    inp.onchange=async e=>{const f=e.target.files[0]; if(!f) return; toast('Memproses foto…');
      try{ const b=await compressImage(f); edPhotos[key]=b; const url=URL.createObjectURL(b);
        area.innerHTML=`<div class="photo-prev sm"><img src="${url}"><button class="rm">✕</button></div>`;
        area.querySelector('.rm').onclick=()=>{ edPhotos[key]=null; slot(id,key,null); };
      }catch(_){ toast('Gagal memproses foto',false); }};
  }
  slot('edF1Area','f1', v?v.photo:null);
  slot('edF2Area','f2', v?v.photo2:null);

  $('#edSave').onclick=async()=>{
    const toko=$('#edToko').value.trim(), tgl=$('#edTgl').value;

    if(!tgl){ $('#edErr').innerHTML='<div class="err">Tanggal wajib diisi.</div>'; return; }
    const b=$('#edSave'); b.disabled=true; const t0=b.textContent; b.textContent='Menyimpan…';
    try{
      const jamVal=$('#edJam').value||'08:00';
      const waktu=new Date(`${tgl}T${jamVal}:00`);
      const fd=new FormData();
      fd.append('sales', $('#edSales').value);
      fd.append('toko', toko);
      fd.append('kategori', $('#edKat').value);
      fd.append('telp', $('#edTelp').value.trim());
      fd.append('date', tgl);
      fd.append('visitTime', waktu.toISOString());
      fd.append('tokoBaru', $('#edBaru').checked?'true':'false');
      fd.append('barangDijual', [...document.querySelectorAll('.edBarang:checked')].map(x=>x.value).join(', '));
      fd.append('prospek', (document.querySelector('input[name="edProspek"]:checked')||{}).value||'');
      fd.append('picNama', $('#edPic')?$('#edPic').value.trim():'');
      fd.append('picTelp', $('#edPicTelp')?$('#edPicTelp').value.trim():'');
      fd.append('picJabatan', $('#edPicJab')?$('#edPicJab').value.trim():'');
      fd.append('note', $('#edNote').value.trim());
      const la=$('#edLat').value.trim(), lo=$('#edLng').value.trim();
      if(la) fd.append('lat', la);
      if(lo) fd.append('lng', lo);
      if(edPhotos.f1) fd.append('photo', edPhotos.f1, 'foto1.jpg');
      if(edPhotos.f2) fd.append('photo2', edPhotos.f2, 'foto2.jpg');
      if(isNew) await api('/api/collections/visits/records',{method:'POST',body:fd});
      else await api('/api/collections/visits/records/'+v.id,{method:'PATCH',body:fd});
      toast(isNew?'Kunjungan baru tersimpan ✓':'Perubahan tersimpan ✓');
      close();
      mgrData=await loadVisits(null);
      drawDataTab();
    }catch(err){ $('#edErr').innerHTML='<div class="err">Gagal menyimpan — periksa data (butuh peran Admin).</div>'; }
    finally{ b.disabled=false; b.textContent=t0; }
  };
}

/* --- Excel export (manager only) --- */
const ABSEN_MIN_TEMPAT=4;
function buildAbsensiSheets(allRows){
  // group by sales+date -> count of visits (places) that day
  const byKey={};
  allRows.forEach(v=>{
    const key=v.username+'|'+v.date;
    if(!byKey[key]) byKey[key]={sales:v.salesName, username:v.username, date:v.date, count:0};
    byKey[key].count++;
  });
  const dayRows=Object.values(byKey).sort((a,b)=> a.sales.localeCompare(b.sales) || a.date.localeCompare(b.date));
  const detail=dayRows.map(r=>{
    const d=new Date(r.date+'T00:00:00');
    return { Tanggal:r.date, Hari:HARI[d.getDay()], Sales:r.sales, 'Jumlah Tempat Dikunjungi':r.count,
      Status: r.count>=ABSEN_MIN_TEMPAT?'Hadir':'Tidak Masuk' };
  });
  // monthly summary per sales+month
  const bySumKey={};
  dayRows.forEach(r=>{
    const bulan=r.date.slice(0,7); // YYYY-MM
    const key=r.username+'|'+bulan;
    if(!bySumKey[key]) bySumKey[key]={sales:r.sales, bulan, hadir:0, tidak:0, total:0};
    bySumKey[key].total++;
    if(r.count>=ABSEN_MIN_TEMPAT) bySumKey[key].hadir++; else bySumKey[key].tidak++;
  });
  const summary=Object.values(bySumKey)
    .sort((a,b)=> a.sales.localeCompare(b.sales) || a.bulan.localeCompare(b.bulan))
    .map(r=>({ Sales:r.sales, Bulan:r.bulan, 'Hari Hadir (≥4 tempat)':r.hadir, 'Hari Tidak Masuk (<4 tempat)':r.tidak, 'Total Hari Tercatat':r.total }));
  return {detail, summary};
}
async function exportExcel(fSales,fDate,fMonth,dFrom,dTo){
  const pakaiPeriode=!!(dFrom && dTo);
  let rows=mgrData.slice();
  if(fSales) rows=rows.filter(v=>v.username===fSales);
  if(pakaiPeriode) rows=rows.filter(v=>v.date>=dFrom && v.date<=dTo);
  else if(fMonth) rows=rows.filter(v=>String(v.date||'').startsWith(fMonth));
  else if(fDate)  rows=rows.filter(v=>v.date===fDate.trim());
  if(!rows.length){ toast('Tidak ada data untuk diekspor',false); return; }
  if(typeof ExcelJS==='undefined'){ toast('Modul Excel belum termuat, coba lagi',false); return; }
  toast('Menyiapkan Excel…');

  // urutkan: per sales lalu tanggal lalu jam
  rows.sort((a,b)=> (a.salesName||'').localeCompare(b.salesName||'') || a.date.localeCompare(b.date) || a.ts-b.ts);

  const wb=new ExcelJS.Workbook();
  wb.creator='KANVAS — Aneka Baja'; wb.created=new Date();

  const HEAD_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3B57'}};
  const HEAD_FONT={bold:true,color:{argb:'FFFFFFFF'},size:11};
  const GROUP_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDE9DD'}};
  const THIN={style:'thin',color:{argb:'FFD5DAE0'}};
  const BORDER={top:THIN,left:THIN,bottom:THIN,right:THIN};

  function styleHeader(ws,rowNo){
    const r=ws.getRow(rowNo);
    r.eachCell(c=>{ c.fill=HEAD_FILL; c.font=HEAD_FONT; c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; c.border=BORDER; });
    r.height=26;
  }

  /* ---------- SHEET 1: KUNJUNGAN (dengan foto & link) ---------- */
  const ws=wb.addWorksheet('Kunjungan',{views:[{state:'frozen',ySplit:1}]});
  ws.columns=[
    {header:'Tanggal',width:12},{header:'Hari',width:9},{header:'Jam',width:8},
    {header:'Sales',width:18},{header:'ID Toko',width:26},{header:'Kategori',width:10},{header:'Toko / Project',width:28},
    {header:'No. Telepon',width:16},{header:'Toko Baru',width:10},{header:'Prospek',width:12},{header:'Barang Dijual',width:30},
    {header:'PIC',width:16},{header:'Telp PIC',width:16},{header:'Jabatan PIC',width:14},
    {header:'Lokasi GPS',width:14},{header:'Foto 1',width:16},{header:'Foto 2',width:16},
    {header:'Catatan',width:38},
  ];
  styleHeader(ws,1);

  // ambil semua foto (paralel, tapi dibatasi supaya tidak membanjiri server)
  async function fetchImg(url){
    if(!url) return null;
    try{
      const r=await fetch(url); if(!r.ok) return null;
      const buf=await r.arrayBuffer();
      const ext=(url.split('.').pop()||'jpg').toLowerCase().split('?')[0];
      return {buf, ext:(ext==='png'?'png':'jpeg')};
    }catch(_){ return null; }
  }

  let rowNo=1;
  for(const v of rows){
    const d=new Date(v.ts);
    rowNo++;
    const r=ws.addRow([
      v.date, HARI[d.getDay()], fmtJamShort(d),
      v.salesName, v.tokoId||'', v.kategori||'Toko', v.toko,
      v.telp||'', v.tokoBaru?'Ya':'Tidak', v.prospek||'', v.barangDijual||'',
      v.picNama||'', v.picTelp||'', v.picJabatan||'',
      '', '', '', v.note||''
    ]);
    r.height=52;
    r.eachCell({includeEmpty:true},c=>{ c.border=BORDER; c.alignment={vertical:'middle',wrapText:true}; });
    // no telp sebagai TEKS agar angka 0 di depan tidak hilang
    r.getCell(8).numFmt='@'; r.getCell(13).numFmt='@';
    // kategori berwarna
    if((v.kategori||'Toko')==='Proyek'){ r.getCell(6).font={bold:true,color:{argb:'FFC24A0F'}}; }
    if(v.tokoBaru){ r.getCell(9).font={bold:true,color:{argb:'FF1F8F4E'}}; }
    if(v.prospek){
      const pk=String(v.prospek).toUpperCase();
      const warna = pk==='HIGH'?'FF1F8F4E' : (pk==='MEDIUM'?'FFC97A00':'FF5A6774');
      const bg    = pk==='HIGH'?'FFE8F6EE' : (pk==='MEDIUM'?'FFFFF3E0':'FFEEF1F5');
      const c9=r.getCell(10);
      c9.font={bold:true,color:{argb:warna}};
      c9.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
      c9.alignment={vertical:'middle',horizontal:'center'};
    }
    // Lokasi GPS -> link langsung yang bisa diklik
    if(v.lat && v.lng){
      const cell=r.getCell(15);
      cell.value={text:'📍 Buka Peta', hyperlink:gmaps(v.lat,v.lng)};
      cell.font={color:{argb:'FF1155CC'},underline:true};
      cell.alignment={vertical:'middle',horizontal:'center'};
    } else { r.getCell(15).value='—'; }
    // Foto disematkan kecil, klik gambar -> buka foto ukuran penuh
    const shots=[{u:v.photo,col:15},{u:v.photo2,col:16}];
    for(const sh of shots){
      if(!sh.u) continue;
      const img=await fetchImg(sh.u);
      if(!img) continue;
      const id=wb.addImage({buffer:img.buf, extension:img.ext});
      ws.addImage(id,{
        tl:{col:sh.col+0.1, row:rowNo-1+0.1},
        ext:{width:96, height:60},
        hyperlinks:{hyperlink:sh.u, tooltip:'Klik untuk melihat foto ukuran penuh'}
      });
    }
  }
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:18}};

  /* ---------- SHEET 2 & 3: ABSENSI (dikelompokkan per sales) ---------- */
  let absenSource = mgrData.slice();
  if(fSales) absenSource = absenSource.filter(v=>v.username===fSales);
  if(pakaiPeriode) absenSource = absenSource.filter(v=>v.date>=dFrom && v.date<=dTo);
  else if(fMonth) absenSource = absenSource.filter(v=>String(v.date||'').startsWith(fMonth));
  const byKey={};
  absenSource.forEach(v=>{
    const k=v.username+'|'+v.date;
    if(!byKey[k]) byKey[k]={sales:v.salesName, username:v.username, date:v.date, count:0};
    byKey[k].count++;
  });
  const dayRows=Object.values(byKey).sort((a,b)=> (a.sales||'').localeCompare(b.sales||'') || a.date.localeCompare(b.date));

  const wsD=wb.addWorksheet('Absensi Harian',{views:[{state:'frozen',ySplit:1}]});
  wsD.columns=[{header:'Sales',width:20},{header:'Tanggal',width:13},{header:'Hari',width:10},
               {header:'Jumlah Tempat',width:16},{header:'Status',width:14}];
  styleHeader(wsD,1);
  let curSales=null;
  dayRows.forEach(r=>{
    if(r.sales!==curSales){
      curSales=r.sales;
      const g=wsD.addRow([r.sales,'','','','']);
      wsD.mergeCells(g.number,1,g.number,5);
      const c=g.getCell(1);
      c.value=`▸  ${r.sales}`;
      c.font={bold:true,size:11.5,color:{argb:'FF9A3A0C'}};
      c.fill=GROUP_FILL; c.alignment={vertical:'middle'};
      g.height=20;
    }
    const d=new Date(r.date+'T00:00:00');
    const hadir=r.count>=ABSEN_MIN_TEMPAT;
    const row=wsD.addRow(['', r.date, HARI[d.getDay()], r.count, hadir?'Hadir':'Tidak Masuk']);
    row.eachCell({includeEmpty:true},c=>{ c.border=BORDER; });
    row.getCell(4).alignment={horizontal:'center'};
    row.getCell(5).alignment={horizontal:'center'};
    row.getCell(5).font={bold:true,color:{argb: hadir?'FF1F8F4E':'FFC0392B'}};
    row.getCell(5).fill={type:'pattern',pattern:'solid',fgColor:{argb: hadir?'FFE8F6EE':'FFFDECEA'}};
  });

  const bySum={};
  dayRows.forEach(r=>{
    const bulan=r.date.slice(0,7);
    const k=r.username+'|'+bulan;
    if(!bySum[k]) bySum[k]={sales:r.sales, bulan, hadir:0, tidak:0, total:0};
    bySum[k].total++;
    if(r.count>=ABSEN_MIN_TEMPAT) bySum[k].hadir++; else bySum[k].tidak++;
  });
  const sums=Object.values(bySum).sort((a,b)=> (a.sales||'').localeCompare(b.sales||'') || a.bulan.localeCompare(b.bulan));

  const wsS=wb.addWorksheet('Rekap Bulanan');
  wsS.columns=[{header:'Sales',width:20},{header:'Bulan',width:12},
               {header:'Hari Hadir',width:13},{header:'Hari Tidak Masuk',width:18},
               {header:'Total Hari Tercatat',width:19},{header:'% Kehadiran',width:14}];
  styleHeader(wsS,1);
  const NAMA_BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  curSales=null;
  sums.forEach(r=>{
    if(r.sales!==curSales){
      curSales=r.sales;
      const g=wsS.addRow([r.sales,'','','','','']);
      wsS.mergeCells(g.number,1,g.number,6);
      const c=g.getCell(1);
      c.value=`▸  ${r.sales}`;
      c.font={bold:true,size:11.5,color:{argb:'FF9A3A0C'}};
      c.fill=GROUP_FILL; g.height=20;
    }
    const [yy,mm]=r.bulan.split('-');
    const pct = r.total? Math.round(r.hadir/r.total*100) : 0;
    const row=wsS.addRow(['', `${NAMA_BULAN[+mm-1]} ${yy}`, r.hadir, r.tidak, r.total, pct/100]);
    row.eachCell({includeEmpty:true},c=>{ c.border=BORDER; });
    [3,4,5].forEach(i=>row.getCell(i).alignment={horizontal:'center'});
    row.getCell(3).font={bold:true,color:{argb:'FF1F8F4E'}};
    row.getCell(4).font={bold:true,color:{argb:'FFC0392B'}};
    row.getCell(6).numFmt='0%';
    row.getCell(6).alignment={horizontal:'center'};
  });
  wsS.addRow([]);
  const note=wsS.addRow([`Aturan: kunjungan ≥ ${ABSEN_MIN_TEMPAT} tempat dalam sehari = Hadir; kurang dari itu = Tidak Masuk.`]);
  note.getCell(1).font={italic:true,size:10,color:{argb:'FF666666'}};
  wsS.mergeCells(note.number,1,note.number,6);

  const NAMA_BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const bulanTag = pakaiPeriode ? `${dFrom}_sd_${dTo}` : (fDate ? fDate : (fMonth ? (()=>{ const [y,mm]=fMonth.split('-'); return `${NAMA_BLN[+mm-1]}-${y}`; })() : 'semua-bulan'));
  const tag=fSales?fSales:'semua';
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`laporan-kanvasing-${tag}-${bulanTag}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('File Excel diunduh ✓');
}

/* --- SALES ROUTE MAP TAB --- */
let rSales=null, routeMap=null, rFrom='', rTo='';
function drawPetaTab(){
  // default to first sales that has data
  const withData=[...new Map(mgrData.map(v=>[v.username,v.salesName])).entries()];
  if(rSales===null) rSales = withData.length?withData[0][0]:'';
  const isAll = rSales==='ALL';
  const pakaiRentang = !!(rFrom && rTo);
  const inRange=(d)=>{ if(rFrom && d < rFrom) return false; if(rTo && d > rTo) return false; return true; };
  const monthVisits=mgrData.filter(v=>{
    const cocokPeriode = pakaiRentang ? inRange(v.date) : v.date.startsWith(mgrMonth);
    return cocokPeriode && (isAll || !rSales || v.username===rSales);
  }).sort((a,b)=>a.ts-b.ts);
  const fmtTgl=(iso)=>{ const [y,m,d]=iso.split('-'); return `${d} ${BULAN[+m-1]} ${y}`; };
  const monthLabel = pakaiRentang ? `${fmtTgl(rFrom)} – ${fmtTgl(rTo)}` : `${BULAN[+mgrMonth.split('-')[1]-1]} ${mgrMonth.split('-')[0]}`;
  const days=new Set(monthVisits.map(v=>v.date)).size;
  const nSalesAktif=new Set(monthVisits.map(v=>v.username)).size;
  const selName=isAll?'Semua sales':(rSales?(withData.find(([u])=>u===rSales)||['',''])[1]:'Semua sales');

  const b=$('#mgrTabBody');
  b.innerHTML=`
    <div class="toolbar">
      <label class="fld"><span class="lbl">Sales</span><select id="rSales"><option value="ALL" ${isAll?'selected':''}>🌐 SEMUA SALES</option>${withData.map(([u,n])=>`<option value="${u}" ${rSales===u?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
      <label class="fld"><span class="lbl">Bulan</span><input type="month" id="rMonth" value="${pakaiRentang?'':mgrMonth}" style="width:150px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px"></label>
      <label class="fld"><span class="lbl">Dari tanggal</span><input type="date" id="rFrom" value="${rFrom}" style="width:150px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px"></label>
      <label class="fld"><span class="lbl">Sampai tanggal</span><input type="date" id="rTo" value="${rTo}" style="width:150px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px"></label>
      ${pakaiRentang?`<button class="btn outline sm" id="rClear">Reset periode</button>`:''}
    </div>
    <div class="card">
      <p class="section-eyebrow">Peta Rute Sales</p>
      <h2>${esc(selName)} — ${monthLabel}</h2>
      <p class="sub">${isAll
        ? `Sebaran titik kunjungan <b>semua sales</b> — tiap sales warnanya berbeda. Berguna melihat wilayah mana yang belum terjangkau. ${monthVisits.length} titik · ${nSalesAktif} sales aktif.`
        : `Titik koordinat setiap kunjungan (urut waktu). Garis menunjukkan pergerakan sales pada periode ini. ${monthVisits.length} titik · ${days} hari aktif.`}</p>
      <div class="map-tools">${isAll?'':`<button class="btn ghost sm" id="btnGmapsRoute">🗺️ Buka rute di Google Maps</button>`}</div>
      <div id="routeMap"></div>
      <div class="route-legend" id="routeLegend"></div>
    </div>`;

  $('#rSales').onchange=e=>{ rSales=e.target.value; drawPetaTab(); };
  $('#rMonth').onchange=e=>{ mgrMonth=e.target.value; rFrom=''; rTo=''; drawPetaTab(); };
  const rf=$('#rFrom'), rt=$('#rTo');
  const applyRange=()=>{
    const f=rf.value, t=rt.value;
    if(f && t && f>t){ toast('Tanggal "Dari" harus sebelum "Sampai"',false); return; }
    rFrom=f; rTo=t; drawPetaTab();
  };
  if(rf) rf.onchange=applyRange;
  if(rt) rt.onchange=applyRange;
  const rc=$('#rClear'); if(rc) rc.onclick=()=>{ rFrom=''; rTo=''; drawPetaTab(); };

  const gbtn=$('#btnGmapsRoute');
  if(gbtn) gbtn.onclick=()=>{
    const pts=monthVisits.filter(v=>v.lat&&v.lng);
    if(!pts.length){ toast('Belum ada titik kunjungan bulan ini',false); return; }
    const c=(v)=>`${v.lat},${v.lng}`;
    if(pts.length===1){ window.open(`https://www.google.com/maps/search/?api=1&query=${c(pts[0])}`,'_blank'); return; }
    // Google Maps membatasi jumlah titik singgah — ambil maksimal 8 titik di tengah, tersebar merata
    const mid=pts.slice(1,-1);
    let wp=mid;
    if(mid.length>8){
      const step=mid.length/8; wp=[];
      for(let i=0;i<8;i++) wp.push(mid[Math.floor(i*step)]);
    }
    const url=`https://www.google.com/maps/dir/?api=1&origin=${c(pts[0])}&destination=${c(pts[pts.length-1])}`
      + (wp.length?`&waypoints=${wp.map(c).join('|')}`:'') + '&travelmode=driving';
    window.open(url,'_blank');
    if(mid.length>8) toast(`Rute dibuka di Google Maps (${wp.length+2} dari ${pts.length} titik — batas Google)`);
  };

  // build map
  if(routeMap){ routeMap.remove(); routeMap=null; }
  if(typeof L==='undefined'){ $('#routeMap').innerHTML='<div class="empty">Peta gagal dimuat (perlu koneksi internet).</div>'; return; }
  if(!monthVisits.length){ $('#routeMap').innerHTML='<div class="empty"><span class="ic">🗺️</span>Belum ada titik kunjungan bulan ini.</div>'; return; }

  setTimeout(()=>{
    routeMap=L.map('routeMap',{scrollWheelZoom:false});
    const petaJalan=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
    const petaSatelit=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19,attribution:'© Esri'});
    petaJalan.addTo(routeMap);
    L.control.layers({'Peta Jalan':petaJalan,'Satelit':petaSatelit},null,{position:'topright'}).addTo(routeMap);
    const pts=monthVisits.map(v=>[v.lat,v.lng]);
    const PALET=['#E8531A','#1F8F4E','#1D5FA8','#8E44AD','#C0392B','#0E8B8B','#D4880F','#C2185B','#5D6D7E','#2E7D32','#6A3FB5','#00838F'];

    if(isAll){
      // === MODE SEMUA SALES: warna berbeda per sales, tanpa garis rute ===
      const salesUniq=[...new Set(monthVisits.map(v=>v.username))];
      const warna={}; salesUniq.forEach((u,i)=>warna[u]=PALET[i%PALET.length]);
      const namaSales={}; monthVisits.forEach(v=>namaSales[v.username]=v.salesName);
      monthVisits.forEach(v=>{
        const col=warna[v.username];
        L.circleMarker([v.lat,v.lng],{radius:7,color:'#fff',weight:2,fillColor:col,fillOpacity:.95})
          .addTo(routeMap)
          .bindPopup(`<b>${esc(v.salesName)}</b><br>${esc(v.toko)}<br>${v.date} · ${fmtJamShort(new Date(v.ts))}`);
      });
      // legenda warna per sales + jumlah titik
      const cnt={}; monthVisits.forEach(v=>cnt[v.username]=(cnt[v.username]||0)+1);
      const leg=$('#routeLegend');
      if(leg) leg.innerHTML=salesUniq
        .sort((a,b)=>cnt[b]-cnt[a])
        .map(u=>`<span><span class="lg-dot" style="background:${warna[u]}"></span>${esc(namaSales[u])} <b>(${cnt[u]})</b></span>`).join('');
    } else {
      // === MODE SATU SALES: rute berurutan seperti biasa ===
      L.polyline(pts,{color:'#FF6A2B',weight:3,opacity:.65,dashArray:'6 6'}).addTo(routeMap);
      monthVisits.forEach((v,i)=>{
        const cls=i===0?'first':(i===monthVisits.length-1?'last':'');
        const icon=L.divIcon({className:'',html:`<div class="route-pin ${cls}"><span>${i+1}</span></div>`,iconSize:[26,26],iconAnchor:[13,24]});
        L.marker([v.lat,v.lng],{icon}).addTo(routeMap)
          .bindPopup(`<b>${esc(v.toko)}</b><br>${v.date} · ${fmtJamShort(new Date(v.ts))}<br>±${v.acc}m akurasi${v.note?'<br><i>'+esc(v.note)+'</i>':''}`);
      });
      const leg=$('#routeLegend');
      if(leg) leg.innerHTML=`<span><span class="lg-dot" style="background:#12A150"></span><b>Titik pertama</b></span>`
        +`<span><span class="lg-dot" style="background:#FF6A2B"></span>Kunjungan</span>`
        +`<span><span class="lg-dot" style="background:#10141B"></span><b>Titik terakhir</b></span>`;
    }
    routeMap.fitBounds(L.latLngBounds(pts).pad(0.15));
    setTimeout(()=>routeMap.invalidateSize(),200);
  },60);
}

    const name=$('#aName').value.trim(), email=$('#aUser').value.trim().toLowerCase(), pass=$('#aPass').value.trim(), role=$('#aRole').value;
    if(!name||!email||!pass){ $('#akunErr').innerHTML='<div class="err">Semua kolom wajib diisi.</div>'; return; }
    if(pass.length<8){ $('#akunErr').innerHTML='<div class="err">Password minimal 8 karakter.</div>'; return; }
    const btn=$('#aAdd'); btn.disabled=true; btn.textContent='Menyimpan…';
    try{
      await api('/api/collections/users/records',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password:pass,passwordConfirm:pass,name,role,emailVisibility:true})});
      toast('Akun dibuat ✓'); drawAkunTab();
    }catch(err){
      const msg=(err.data&&err.data.data&&err.data.data.email)?'Email sudah dipakai atau tidak valid.':'Gagal membuat akun (perlu peran manager).';
      $('#akunErr').innerHTML=`<div class="err">${msg}</div>`; btn.disabled=false; btn.textContent='Tambah akun';
    }
  };

  document.querySelectorAll('.role-edit').forEach(sel=>{
    sel.onchange=async()=>{
      const id=sel.dataset.id, newRole=sel.value, nama=sel.dataset.name;
      sel.disabled=true;
      try{
        await api('/api/collections/users/records/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:newRole})});
        const label=newRole==='admin'?'Admin':(newRole==='manager'?'Manager':(newRole==='sales_proyek'?'Sales Project':'Sales'));
        toast(`Peran ${nama} diubah jadi ${label} ✓`);
      }catch(err){
        toast('Gagal mengubah peran',false);
        drawAkunTab();
      }
      sel.disabled=false;
    };
  });

  const uOverlay=$('#userDetailOverlay'), uCard=$('#userDetailCard');
  function closeUser(){ uOverlay.hidden=true; uCard.innerHTML=''; }
  document.querySelectorAll('.u-edit').forEach(btn=>btn.onclick=()=>{
    const u=users.find(x=>x.id===btn.dataset.id); if(!u) return;
    const roleLabel=u.role==='admin'?'Admin':(u.role==='manager'?'Manager / SPV':(u.role==='sales_proyek'?'Sales Project':'Sales'));
    uCard.innerHTML=`
      <button class="vd-close" id="uClose">✕</button>
      <div class="vd-toko">${esc(u.name||'—')}</div>
      <div class="vd-when">${esc(u.email||'')} · ${roleLabel}</div>
      <div id="uErr"></div>
      <label class="fld"><span class="lbl">Nama</span><input type="text" id="uName" value="${esc(u.name||'')}"></label>
      <label class="fld"><span class="lbl">Email</span><input type="email" id="uEmail" value="${esc(u.email||'')}"></label>
      <label class="fld"><span class="lbl">Peran</span><select id="uRole">
        <option value="sales" ${u.role==='sales'?'selected':''}>Sales</option>
        <option value="sales_proyek" ${u.role==='sales_proyek'?'selected':''}>Sales Project</option>
        <option value="manager" ${u.role==='manager'?'selected':''}>Manager / SPV</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      </select></label>
      <button class="btn" id="uSave" style="margin-bottom:16px">Simpan perubahan</button>
      <div class="pw-note">
        <b>Password tidak bisa dilihat.</b> Sistem menyimpannya dalam bentuk teracak (hash) demi
        keamanan — tidak ada yang bisa membacanya, termasuk admin. Kalau sales lupa password,
        buat password baru di bawah lalu beritahukan kepadanya.
      </div>
      <label class="fld"><span class="lbl">Password baru (min. 8 karakter)</span>
        <input type="text" id="uPass" placeholder="Ketik password baru"></label>
      <button class="btn ghost" id="uReset">🔑 Reset password</button>
    `;
    uOverlay.hidden=false;
    $('#uClose').onclick=closeUser;
    uOverlay.onclick=(e)=>{ if(e.target===uOverlay) closeUser(); };
    $('#uSave').onclick=async()=>{
      const b=$('#uSave'); b.disabled=true; b.textContent='Menyimpan…';
      try{
        await api('/api/collections/users/records/'+u.id,{method:'PATCH',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:$('#uName').value.trim(), email:$('#uEmail').value.trim(), role:$('#uRole').value})});
        toast('Data akun diperbarui ✓'); closeUser(); drawAkunTab();
      }catch(err){ $('#uErr').innerHTML='<div class="err">Gagal menyimpan — email mungkin sudah dipakai.</div>'; }
      finally{ b.disabled=false; b.textContent='Simpan perubahan'; }
    };
    $('#uReset').onclick=async()=>{
      const pw=$('#uPass').value.trim();
      if(pw.length<8){ $('#uErr').innerHTML='<div class="err">Password minimal 8 karakter.</div>'; return; }
      const b=$('#uReset'); b.disabled=true; b.textContent='Menyimpan…';
      try{
        await api('/api/collections/users/records/'+u.id,{method:'PATCH',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:pw, passwordConfirm:pw})});
        toast('Password berhasil diubah ✓ — beritahukan ke sales');
        $('#uErr').innerHTML='<div class="ok-note">Password baru aktif. Catat & sampaikan ke sales yang bersangkutan.</div>';
        $('#uPass').value='';
      }catch(err){ $('#uErr').innerHTML='<div class="err">Gagal mengubah password.</div>'; }
      finally{ b.disabled=false; b.textContent='🔑 Reset password'; }
    };
  });
}

/* --- Laporan A4 (detail) Pengajuan Tempo --- */
function tempoPdf(items){
  if(!items||!items.length){toast('Belum ada data untuk dicetak',false);return;}
  const fu=(r,f)=> r[f]?`${PB}/api/files/tempo/${r.id}/${r[f]}`:'';
  const phLabels=['Tampak Depan','Stok','Stok 2','KTP Penanggung Jawab','NPWP'];
  const sections=items.map((r,idx)=>{
    const sn=r.expand&&r.expand.sales?r.expand.sales.name:'-';
    const d=new Date(r.submittedAt||r.created);
    const m=/(\d+)/.exec(r.termPembayaran||''); const tempo=m?m[1]+' hari':(r.termPembayaran||'-');
    const kv=[
      ['Nama Toko', r.namaToko||'-'],
      ['Sales', sn],
      ['Tanggal Pengajuan', ymd(d)],
      ['Tempo Pembayaran', tempo+' ('+(r.termPembayaran||'-')+')'],
      ['Omzet per Bulan', 'Rp '+Number(r.omset||0).toLocaleString('id-ID')],
      ['Alamat Toko', r.alamatToko||'-'],
      ['Penanggung Jawab', r.penanggungJawab||'-'],
      ['No. Telp PJ', r.telpPj||'-'],
      ['Alamat Penagihan', r.alamatPenagihan||'(sama dengan alamat toko)'],
      ['Jumlah Armada', 'Truk: '+(r.jumlahTruk||0)+'   |   Pickup: '+(r.jumlahPickup||0)],
      ['Lokasi (Google Maps)', r.lokasiMaps||'-'],
      ['Pakai Faktur Pajak', r.pakaiFaktur?'Ya':'Tidak'],
      ...(r.pakaiFaktur?[['Nama Perusahaan', r.namaPerusahaan||'-'],['Nama Direktur', r.namaDirektur||'-'],['No. Telp PIC (Faktur)', r.telpPicFaktur||'-']]:[]),
      ['Catatan Sales', r.note||'-'],
    ].map(x=>{const v=String(x[1]);const val=/^https?:\/\//.test(v)?`<a href="${v}">Buka di Google Maps</a>`:esc(v);return `<tr><td class="k">${x[0]}</td><td class="v">${val}</td></tr>`;}).join('');
    const ph=['fotoDepan','fotoStok','fotoStok2','fotoKtp','fotoNpwp'].map((f,i)=>({u:fu(r,f),l:phLabels[i]})).filter(o=>o.u);
    const phHtml=ph.length?`<div class="ph-title">Foto</div><div class="ph-row">${ph.map(o=>`<figure><img src="${o.u}"><figcaption>${o.l}</figcaption></figure>`).join('')}</div>`:'';
    return `<section class="sub"${idx>0?' style="page-break-before:always"':''}>
      <div class="hd"><div><h1>${esc(String(r.namaToko||'-').toUpperCase())}</h1><div class="t2">Laporan Pengajuan Tempo · Aneka Baja</div></div><div class="dt">${fmtTanggal(d)}</div></div>
      <table class="kv">${kv}</table>${phHtml}
    </section>`;
  }).join('');
  const w=window.open('','_blank');
  if(!w){toast('Popup diblokir \u2014 izinkan popup untuk cetak',false);return;}
  w.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Laporan Pengajuan Tempo</title>
  <style>@page{size:A4;margin:15mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#141A22;margin:0}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #FF6A2B;padding-bottom:8px;margin-bottom:14px}
  .hd h1{font-size:19px;margin:0;letter-spacing:1px}.hd .t2{font-size:11px;color:#666;margin-top:2px}.hd .dt{font-size:11px;color:#666}
  table.kv{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
  table.kv td{border:1px solid #bbb;padding:7px 10px;vertical-align:top}
  table.kv td.k{width:34%;background:#f4f4f4;font-weight:bold;color:#333}
  .ph-title{font-size:11px;font-weight:bold;color:#666;text-transform:uppercase;margin:4px 0 6px}
  .ph-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0}figure img{width:100%;height:52mm;object-fit:cover;border:1px solid #ccc}
  figcaption{font-size:10px;color:#666;text-align:center;margin-top:3px}</style></head>
  <body>${sections}
  <script>window.addEventListener('load',function(){var imgs=Array.prototype.slice.call(document.images);Promise.all(imgs.map(function(im){return im.complete?Promise.resolve():new Promise(function(res){im.onload=im.onerror=res;});})).then(function(){setTimeout(function(){window.focus();window.print();},350);});});<\/script>
  </body></html>`);
  w.document.close();
}

/* --- MANAGER: tab Pengajuan Tempo --- */
async function drawTempoTab(){
  const b=$('#mgrTabBody'); b.innerHTML='<div class="empty">Memuat…</div>';
  let items=[];
  try{const d=await api('/api/collections/tempo/records?perPage=500&sort=-created&expand=sales');items=d.items||[];}catch(e){}
  const fu=(r,f)=> r[f]?`${PB}/api/files/tempo/${r.id}/${r[f]}`:'';
  b.innerHTML=`
    <div class="toolbar no-print"><div class="spacer"></div>${isAdmin()?`<button class="btn ghost sm" id="btnAddTempo">➕ Tambah pengajuan</button>`:''}<button class="btn ghost sm" id="btnTempoPdf">🖨️ Laporan A4 (PDF)</button><button class="btn sm" id="btnTempoXlsx">⬇️ Ekspor ke Excel</button></div>
    <div id="tempoEditorOverlay" class="visit-detail-overlay" hidden><div class="visit-detail-card" id="tempoEditorCard"></div></div>
    ${items.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Sales</th><th>Toko</th><th>Omzet/bln</th><th>PJ</th><th>Telp</th><th>Term</th><th>Truk/Pickup</th><th>Faktur</th><th>Alamat toko</th><th>Alamat penagihan</th><th>Lokasi</th><th>Foto</th><th>Catatan</th><th>Aksi</th></tr></thead>
      <tbody>${items.map(r=>{const d=new Date(r.submittedAt||r.created);const sn=r.expand&&r.expand.sales?r.expand.sales.name:'—';const ph=['fotoDepan','fotoStok','fotoStok2','fotoKtp','fotoNpwp'].map(f=>fu(r,f)).filter(Boolean);return `<tr>
        <td>${ymd(d)}</td><td class="sales-tag">${esc(sn)}</td><td>${esc(r.namaToko||'')}</td>
        <td>Rp ${Number(r.omset||0).toLocaleString('id-ID')}</td>
        <td>${esc(r.penanggungJawab||'')}</td><td>${esc(r.telpPj||'')}</td>
        <td>${esc(r.termPembayaran||'')}</td><td>${r.jumlahTruk||0}/${r.jumlahPickup||0}</td>
        <td>${r.pakaiFaktur?`<span class="badge-faktur">FAKTUR</span><div class="pic-line">${esc(r.namaPerusahaan||'')}${r.namaDirektur?' · '+esc(r.namaDirektur):''}</div>`:'—'}</td>
        <td class="note-cell">${esc(r.alamatToko||'')}</td>
        <td class="note-cell">${esc(r.alamatPenagihan||'')}</td>
        <td>${r.lokasiMaps?`<a class="mini-map" href="${r.lokasiMaps}" target="_blank" rel="noopener">📍 Maps</a>`:'—'}</td>
        <td>${ph.length?ph.map(u=>`<img class="tbl-thumb" src="${u}" data-full="${u}">`).join(' '):'—'}</td>
        <td class="note-cell">${esc(r.note||'')}</td>
        <td class="act-cell no-print">
          <button class="mini-btn t-detail" data-id="${r.id}">📄 Detail</button>
          <button class="mini-btn t-share" data-id="${r.id}">📤 Bagikan</button>
          ${isAdmin()?`<button class="mini-btn t-edit" data-id="${r.id}">✏️ Edit</button>`:''}
        </td>
      </tr>`;}).join('')}</tbody></table></div>`:'<div class="empty"><span class="ic">📝</span>Belum ada pengajuan tempo.</div>'}`;
  document.querySelectorAll('.tbl-thumb').forEach(img=>img.onclick=()=>lightbox(img.dataset.full));

  const pdfUrlOf=(r)=> r.pdfLaporan ? `${PB}/api/files/tempo/${r.id}/${r.pdfLaporan}` : '';
  const fileNameOf=(r)=>`Pengajuan-Tempo_${String(r.namaToko||'toko').replace(/[^\w\-]+/g,'-')}_${ymd(new Date(r.submittedAt||r.created))}.pdf`;
  document.querySelectorAll('.t-detail').forEach(btn=>btn.onclick=()=>{
    const r=items.find(x=>x.id===btn.dataset.id); if(!r) return;
    const u=pdfUrlOf(r);
    if(u) window.open(u,'_blank');
    else tempoPdf([r]);
  });
  document.querySelectorAll('.t-share').forEach(btn=>btn.onclick=async()=>{
    const r=items.find(x=>x.id===btn.dataset.id); if(!r) return;
    const u=pdfUrlOf(r);
    if(!u){ toast('PDF belum tersedia untuk pengajuan ini — pakai tombol Detail',false); return; }
    const orig=btn.textContent; btn.disabled=true; btn.textContent='…';
    try{
      const resp=await fetch(u); const blob=await resp.blob();
      const fname=fileNameOf(r);
      const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'Pengajuan Tempo', text:r.namaToko||''}); }catch(e){}
      } else {
        const durl=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=durl; a.download=fname; a.click();
        toast('Berbagi langsung tidak didukung — PDF diunduh, lampirkan manual',false);
      }
    }catch(e){ toast('Gagal menyiapkan PDF',false); }
    finally{ btn.disabled=false; btn.textContent=orig; }
  });

  document.querySelectorAll('.t-edit').forEach(btn=>btn.onclick=()=>{
    const r=items.find(x=>x.id===btn.dataset.id); if(r) openTempoEditor(r, items);
  });
  const bat=$('#btnAddTempo'); if(bat) bat.onclick=()=>openTempoEditor(null, items);
  const bp=$('#btnTempoPdf'); if(bp) bp.onclick=()=>tempoPdf(items);
  const bx=$('#btnTempoXlsx'); if(bx) bx.onclick=()=>{
    if(!items.length){toast('Tidak ada data',false);return;}
    const sorted=items.slice().sort((a,b)=>{
      const an=(a.expand&&a.expand.sales?a.expand.sales.name:'')||'', bn=(b.expand&&b.expand.sales?b.expand.sales.name:'')||'';
      return an.localeCompare(bn) || String(a.submittedAt||a.created).localeCompare(String(b.submittedAt||b.created));
    });
    const rows=sorted.map(r=>{const d=new Date(r.submittedAt||r.created);const sn=r.expand&&r.expand.sales?r.expand.sales.name:'';return {
      Tanggal:ymd(d), Sales:sn, Toko:r.namaToko, 'Alamat toko':r.alamatToko,
      'Omzet per bulan':Number(r.omset||0),
      'Penanggung jawab':r.penanggungJawab, 'Telp PJ':String(r.telpPj||''),
      'Alamat penagihan':r.alamatPenagihan, Truk:r.jumlahTruk, Pickup:r.jumlahPickup,
      'Term pembayaran':r.termPembayaran,
      'Faktur Pajak':r.pakaiFaktur?'Ya':'Tidak',
      'Nama Perusahaan':r.namaPerusahaan||'', 'Nama Direktur':r.namaDirektur||'',
      'Telp PIC (Faktur)':String(r.telpPicFaktur||''),
      'Lokasi':r.lokasiMaps?'Buka Peta':'', Catatan:r.note};});
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:18},{wch:26},{wch:32},{wch:16},{wch:18},{wch:16},{wch:32},{wch:7},{wch:8},{wch:15},{wch:12},{wch:24},{wch:20},{wch:17},{wch:12},{wch:36}];
    // telepon sebagai teks + kolom Lokasi jadi link yang bisa diklik
    sorted.forEach((r,i)=>{
      const rowIdx=i+2;
      ['G','O'].forEach(col=>{ const c=ws[col+rowIdx]; if(c){ c.t='s'; c.z='@'; } });
      if(r.lokasiMaps){ const c=ws['P'+rowIdx]; if(c){ c.l={Target:r.lokasiMaps,Tooltip:'Buka lokasi di Google Maps'}; c.s={font:{color:{rgb:'1155CC'},underline:true}}; } }
    });
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tempo');XLSX.writeFile(wb,`pengajuan-tempo-${ymd(new Date())}.xlsx`);toast('Excel diunduh ✓');
  };
}

/* --- Lightbox --- */
function lightbox(src){
  const el=document.createElement('div'); el.className='lightbox';
  el.innerHTML=`<span class="x">✕</span><img src="${src}">`;
  el.onclick=()=>el.remove();
  document.body.appendChild(el);
}

boot();
