name: Sync OTA from live site

on:
  schedule:
    - cron: '*/30 * * * *'   # tiap ~30 menit (bisa telat sedikit, wajar untuk cron GitHub)
  workflow_dispatch:          # bisa dijalankan manual

permissions:
  contents: write

concurrency:
  group: ota-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build bundle dari situs live
        run: node build.js
      - name: Commit & push kalau ada perubahan
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ota-bot"
            git config user.email "ota-bot@users.noreply.github.com"
            git add -A
            git commit -m "auto-sync OTA $(date -u +%FT%TZ)"
            git push
          else
            echo "tidak ada perubahan untuk dipublish"
          fi
